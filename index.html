<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Xtion Jerry | Official Website</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&family=Permanent+Marker&display=swap"
          rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        /* =====================================================
           GLOBAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                linear-gradient(rgba(0,0,0,.90), rgba(0,0,0,.94)),
                url("texture.jpg");

            background-size: cover;
            background-attachment: fixed;

            color: white;

            font-family: "Inter", sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            font-family: inherit;
        }

        .container {
            width: 94%;
            max-width: 1450px;
            margin: auto;
        }

        /* =====================================================
           NAVIGATION
        ===================================================== */

        header {
            position: sticky;
            top: 0;
            z-index: 999;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.98),
                    rgba(8,13,22,.94),
                    rgba(0,0,0,.98)
                );

            border-bottom: 1px solid rgba(255,193,7,.35);

            backdrop-filter: blur(15px);
        }

        .navbar {
            min-height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 25px;
        }

        .logo {
            font-family: "Bebas Neue", sans-serif;
            font-size: 38px;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        .logo span {
            color: #ffb900;
            font-family: "Permanent Marker", cursive;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;

            transition: .3s;
        }

        .nav-links a:hover {
            color: #ffbf00;
        }

        .nav-links .active {
            color: #ffbf00;
            border-bottom: 2px solid #ffbf00;
            padding-bottom: 8px;
        }

        .book-btn {
            background: #ffb900;
            color: #000;

            padding: 13px 25px;

            border-radius: 30px;

            font-weight: 800;
            font-size: 13px;

            transition: .3s;
        }

        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(255,185,0,.45);
        }

        .mobile-menu {
            display: none;
            font-size: 25px;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 420px;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.10),
                    rgba(0,0,0,.25),
                    rgba(0,0,0,.78)
                ),
                url("hero.jpg");

            background-size: cover;
            background-position: center;

            border-bottom: 1px solid rgba(255,255,255,.15);
        }

        .hero::after {
            content: "";

            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at 15% 50%,
                    rgba(255,150,0,.40),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 65% 30%,
                    rgba(0,130,255,.30),
                    transparent 30%
                );

            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;

            min-height: 420px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-end;

            text-align: left;
        }

        .welcome {
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .hero-title {
            font-family: "Bebas Neue", sans-serif;

            font-size: clamp(65px, 9vw, 125px);

            line-height: .82;

            letter-spacing: 2px;
        }

        .hero-title span {
            color: #ffb900;
            font-family: "Permanent Marker", cursive;
        }

        .hero-role {
            margin-top: 15px;

            font-weight: 700;
            letter-spacing: 3px;
            font-size: 13px;
        }

        .quote {
            margin-top: 18px;

            font-style: italic;

            font-size: 16px;

            max-width: 480px;
        }

        .hero-buttons {
            margin-top: 22px;

            display: flex;
            gap: 12px;
        }

        .yellow-btn,
        .outline-btn {
            padding: 13px 22px;

            border-radius: 30px;

            font-weight: 800;
            font-size: 13px;

            border: none;

            cursor: pointer;

            display: inline-flex;
            align-items: center;
            gap: 8px;

            transition: .3s;
        }

        .yellow-btn {
            background: #ffb900;
            color: #000;
        }

        .outline-btn {
            background: transparent;
            border: 1px solid white;
            color: white;
        }

        .yellow-btn:hover,
        .outline-btn:hover {
            transform: translateY(-3px);
        }

        /* =====================================================
           SECTION HEADINGS
        ===================================================== */

        .section {
            padding: 28px 0;
        }

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .section-title {
            font-family: "Bebas Neue", sans-serif;

            font-size: 38px;
            letter-spacing: 1px;
        }

        .section-title span {
            color: #ffb900;
            font-family: "Permanent Marker", cursive;
        }

        .view-all {
            color: #ffbf00;
            font-size: 13px;
            font-weight: 800;
        }

        /* =====================================================
           SONGS
        ===================================================== */

        .songs {
            display: grid;

            grid-template-columns:
                repeat(5, minmax(0, 1fr));

            gap: 18px;
        }

        .song-card {
            background:
                linear-gradient(
                    145deg,
                    rgba(20,29,40,.96),
                    rgba(4,7,11,.98)
                );

            border: 1px solid rgba(255,255,255,.17);

            border-radius: 9px;

            overflow: hidden;

            box-shadow:
                0 10px 25px rgba(0,0,0,.4);

            transition: .35s;
        }

        .song-card:hover {
            transform: translateY(-7px);

            border-color: #ffb900;

            box-shadow:
                0 15px 35px rgba(255,185,0,.18);
        }

        .song-cover {
            aspect-ratio: 1/1;

            overflow: hidden;

            position: relative;
        }

        .song-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;

            transition: .4s;
        }

        .song-card:hover .song-cover img {
            transform: scale(1.07);
        }

        .song-info {
            padding: 12px;
        }

        .song-name {
            font-size: 16px;
            font-weight: 800;
        }

        .genre {
            color: #aaa;
            font-size: 12px;
            margin-top: 4px;
        }

        .rating {
            margin-top: 9px;

            color: #ffc400;

            font-size: 13px;
        }

        .rating span {
            color: #aaa;
            margin-left: 5px;
        }

        .song-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 7px;

            margin-top: 11px;
        }

        .play-btn,
        .download-btn {
            border: none;

            border-radius: 20px;

            padding: 9px 7px;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;
        }

        .play-btn {
            background: #ffb900;
            color: #000;
        }

        .download-btn {
            background: #087ef5;
            color: white;
        }

        /* =====================================================
           BIOGRAPHY
        ===================================================== */

        .bio-area {
            display: grid;

            grid-template-columns:
                1.3fr .9fr .8fr;

            gap: 20px;

            background:
                linear-gradient(
                    90deg,
                    rgba(20,25,27,.92),
                    rgba(5,8,12,.96)
                );

            border-top: 1px solid rgba(255,255,255,.12);
            border-bottom: 1px solid rgba(255,255,255,.12);

            padding: 25px;
        }

        .bio-text h2 {
            font-family: "Permanent Marker", cursive;

            font-size: 37px;

            margin-bottom: 12px;
        }

        .bio-text h2 span {
            color: #ffb900;
        }

        .bio-text p {
            color: #ddd;

            line-height: 1.7;

            font-size: 14px;

            margin-bottom: 14px;
        }

        .bio-photo {
            min-height: 330px;

            background-image: url("artist.jpg");

            background-size: cover;
            background-position: center;

            border-radius: 7px;

            box-shadow: inset 0 0 80px rgba(0,0,0,.5);
        }

        /* =====================================================
           QUICK FACTS
        ===================================================== */

        .facts h3,
        .contact h3 {
            color: #ffb900;

            font-family: "Permanent Marker", cursive;

            font-size: 20px;

            margin-bottom: 10px;
        }

        .fact {
            display: flex;
            justify-content: space-between;

            padding: 9px 0;

            border-bottom: 1px solid rgba(255,255,255,.12);

            font-size: 12px;
        }

        .fact span:first-child {
            color: #aaa;
        }

        .contact {
            margin-top: 22px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 12px;

            margin: 12px 0;
        }

        .contact-item i {
            color: #ffb900;

            width: 18px;
        }

        .whatsapp {
            background: #10c66b;

            padding: 8px 13px;

            border-radius: 20px;

            font-size: 11px;

            font-weight: 800;

            display: inline-block;

            margin-top: 3px;
        }

        /* =====================================================
           SOCIAL
        ===================================================== */

        .socials {
            display: flex;
            gap: 9px;

            margin-top: 15px;
        }

        .social {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #111;

            border: 1px solid rgba(255,255,255,.2);

            transition: .3s;
        }

        .social:hover {
            transform: translateY(-4px);
            background: #ffb900;
            color: #000;
        }

        /* =====================================================
           LOWER GRID
        ===================================================== */

        .lower-grid {
            display: grid;

            grid-template-columns:
                1.1fr 1fr .8fr;

            gap: 18px;
        }

        .panel {
            background: rgba(5,9,14,.90);

            border: 1px solid rgba(255,255,255,.13);

            border-radius: 7px;

            overflow: hidden;
        }

        .panel-title {
            padding: 13px 15px;

            color: #ffb900;

            font-family: "Permanent Marker", cursive;

            font-size: 18px;
        }

        .video {
            position: relative;
        }

        .video img {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .video-play {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%,-50%);

            width: 58px;
            height: 58px;

            border-radius: 50%;

            background: rgba(0,0,0,.7);

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 21px;
        }

        .video-info {
            padding: 12px;

            font-size: 12px;
        }

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 7px;

            padding: 0 12px 12px;
        }

        .gallery img {
            aspect-ratio: 1/1;

            width: 100%;

            object-fit: cover;

            border-radius: 5px;
        }

        .news {
            padding: 0 15px 15px;
        }

        .news-box {
            border: 1px solid rgba(255,255,255,.15);

            padding: 15px;

            border-radius: 7px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,185,0,.08),
                    rgba(0,0,0,.3)
                );
        }

        .news-box h4 {
            margin-bottom: 9px;
        }

        .news-box p {
            color: #bbb;
            font-size: 13px;
            line-height: 1.5;
        }

        /* =====================================================
           FAN CLUB
        ===================================================== */

        .fan-club {
            margin-top: 18px;

            background:
                linear-gradient(
                    90deg,
                    #111,
                    #080b0e
                );

            border-top: 1px solid rgba(255,185,0,.35);
            border-bottom: 1px solid rgba(255,185,0,.35);

            padding: 18px;

            display: flex;

            align-items: center;

            gap: 20px;
        }

        .mail-icon {
            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: #ffb900;

            color: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 22px;
        }

        .fan-text {
            min-width: 190px;
        }

        .fan-text h3 {
            color: #ffb900;

            font-family: "Permanent Marker", cursive;
        }

        .fan-text p {
            color: #aaa;
            font-size: 11px;
            margin-top: 4px;
        }

        .subscribe {
            display: flex;

            flex: 1;

            max-width: 500px;

            margin-left: auto;
        }

        .subscribe input {
            flex: 1;

            padding: 12px 15px;

            border: 1px solid #333;

            background: #080808;

            color: white;

            border-radius: 25px 0 0 25px;

            outline: none;
        }

        .subscribe button {
            border: none;

            background: #ffb900;

            color: #000;

            padding: 0 25px;

            border-radius: 0 25px 25px 0;

            font-weight: 800;

            cursor: pointer;
        }

        /* =====================================================
           FOOTER
        ===================================================== */

        footer {
            padding: 25px 0;

            background: #030506;

            border-top: 1px solid rgba(255,255,255,.12);
        }

        .footer-inner {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .footer-logo {
            font-family: "Bebas Neue", sans-serif;

            font-size: 30px;
        }

        .footer-logo span {
            color: #ffb900;
            font-family: "Permanent Marker", cursive;
        }

        .footer-links {
            display: flex;

            gap: 15px;

            color: #aaa;

            font-size: 11px;
        }

        .copyright {
            color: #777;

            font-size: 11px;
        }

        /* =====================================================
           MUSIC PLAYER
        ===================================================== */

        .music-player {
            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            z-index: 1000;

            background:
                rgba(5,7,10,.97);

            border-top: 1px solid #ffb900;

            padding: 10px 18px;

            display: none;

            align-items: center;

            gap: 15px;
        }

        .music-player.active {
            display: flex;
        }

        .player-info {
            flex: 1;
        }

        .player-info strong {
            display: block;
            font-size: 13px;
        }

        .player-info span {
            color: #888;
            font-size: 10px;
        }

        audio {
            width: 350px;
            height: 35px;
        }

        .close-player {
            cursor: pointer;
            color: #aaa;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media(max-width:1100px) {

            .songs {
                grid-template-columns:
                    repeat(3, 1fr);
            }

            .bio-area {
                grid-template-columns:
                    1fr 1fr;
            }

            .facts {
                grid-column: span 2;
            }

            .lower-grid {
                grid-template-columns:
                    1fr 1fr;
            }

        }

        @media(max-width:750px) {

            .nav-links,
            header .book-btn {
                display: none;
            }

            .mobile-menu {
                display: block;
            }

            .hero-content {
                align-items: center;
